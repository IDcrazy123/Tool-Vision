# Tool Vision 2.1 - teach-once camera and Z-switch setup
#
# Normal installations need only the camera source and, for Z measurement,
# the physical switch pin. Home the printer, jog T0 into place, then teach
# each station with TV_SETUP_CAMERA and TV_SETUP_ZSWITCH. Learned positions,
# focus quality, and detector settings are stored outside printer.cfg.
#
# Never enable [tool_vision], [axiscope], and [tools_calibrate] together; all
# three may allocate the same probe_multi_axis resource.

[tool_vision]
# Crowsnest MJPEG/snapshot URL, RTSP URL, /dev/video*, or OpenCV camera index.
camera_source: http://127.0.0.1:8080/?action=stream

# Required only for automatic Z measurement. Use the real pin for your board,
# verify its polarity with QUERY_ENDSTOPS, then remove the leading '#'.
# pin: ^PF2

# ---------------------------------------------------------------------------
# Optional hardware overrides - most printers should leave these commented.
# ---------------------------------------------------------------------------
# reference_tool: 0
# camera_mode: auto                 # auto | http | opencv
# camera_rotation: 0                # 0 | 90 | 180 | 270
# camera_flip_x: false
# camera_flip_y: false
# setup_clearance: 5.0              # Z lift added to each taught station
# tool_numbers: 0, 1, 2             # Empty/default = discover dynamically
# tool_select_command: T{tool}

# If a fixture needs more clearance, teach it once with an explicit height:
#   TV_SETUP_CAMERA SAFE_Z=20
#   TV_SETUP_ZSWITCH SAFE_Z=20

# ---------------------------------------------------------------------------
# Advanced compatibility overrides
# ---------------------------------------------------------------------------
# detector_mode: auto               # manual ignores the learned detector
# station_mode: auto                # manual uses legacy cfg coordinates
# server_url: http://127.0.0.1:8085
# xy_travel_speed: 100
# z_travel_speed: 10
# camera_move_speed: 20
# camera_fine_speed: 5
# probe_max_distance: 10
# probe_samples: 10
# result_file: ~/printer_data/config/tool_vision_results.json
# state_file: ~/printer_data/config/tool_vision_state.json
# allow_during_print: false

# Existing installations may keep legacy camera_x/y/z_pos, camera_safe_z,
# zswitch_x/y/z_pos, and zswitch_safe_z values. Teach commands are preferred
# because they verify the hardware and survive restarts without cfg editing.

# Optional workflow hooks remain available: start_gcode, before_tool_gcode,
# after_tool_gcode, finish_gcode, and abort_gcode. Heating and nozzle cleaning
# are machine-specific and should be added only after the basic workflow works.

# ---------------------------------------------------------------------------
# Simple Mainsail/Fluidd macro-panel buttons (kTAMV-style workflow)
# ---------------------------------------------------------------------------
[gcode_macro TOOL_VISION_STATUS]
description: Tool Vision - show setup readiness
gcode:
  TV_STATUS

[gcode_macro TOOL_VISION_SETUP_CAMERA]
description: Tool Vision 1/3 - teach camera at current T0 position
gcode:
  TV_SETUP_CAMERA

[gcode_macro TOOL_VISION_SETUP_ZSWITCH]
description: Tool Vision 2/3 - teach Z switch at current T0 position
gcode:
  TV_SETUP_ZSWITCH

[gcode_macro TOOL_VISION_CALIBRATE_ALL]
description: Tool Vision 3/3 - measure every tool in XYZ
gcode:
  TV_CALIBRATE_ALL MODE=XYZ
