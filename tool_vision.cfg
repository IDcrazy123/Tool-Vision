# Tool Vision 2 - portable XYZ tool-offset measurement
#
# This file is intentionally not included by the production printer.cfg.
# Configure and test it before replacing [axiscope]. Never enable
# [tool_vision], [axiscope], and [tools_calibrate] at the same time.

[tool_vision]
# ---------------------------------------------------------------------------
# Toolchanger integration
# ---------------------------------------------------------------------------
reference_tool: 0
# Empty = discover printer.toolchanger.tool_numbers dynamically.
# Example for a three-tool machine: tool_numbers: 0, 1, 2
tool_numbers:
toolchanger_object: toolchanger
tool_select_command: T{tool}

# ---------------------------------------------------------------------------
# Vision service and camera source
# ---------------------------------------------------------------------------
server_url: http://127.0.0.1:8085

# Supported sources:
#   Crowsnest MJPEG/snapshot URL, RTSP URL, /dev/video*, or OpenCV index.
camera_source: http://127.0.0.1:8080/?action=stream
camera_mode: auto                 # auto | http | opencv
camera_rotation: 0                # 0 | 90 | 180 | 270
camera_flip_x: false
camera_flip_y: false

# 0 means native/default camera output. Tool Vision never resizes frames.
# Set these only when a direct OpenCV/V4L2 device needs an explicit mode.
camera_width: 0
camera_height: 0
camera_fps: 0
camera_connect_timeout: 2.0
camera_read_timeout: 5.0
camera_max_frame_bytes: 8388608
camera_warmup_frames: 0

# ---------------------------------------------------------------------------
# Camera station - REQUIRED before camera movement commands are used
# ---------------------------------------------------------------------------
# Measure these with T0. Keep them commented until real hardware values exist.
# camera_x_pos: 0.0               # Nozzle X over the upward camera
# camera_y_pos: 0.0               # Nozzle Y over the upward camera
# camera_z_pos: 0.0               # Focus/measurement Z
# camera_safe_z: 15.0             # Minimum Z before any XY station travel

# Target and ROI use ratios of the actual transformed frame, so they work at
# any native resolution. 0.5/0.5 is the geometric center.
camera_target_x_ratio: 0.5
camera_target_y_ratio: 0.5
camera_roi_x_min: 0.10
camera_roi_y_min: 0.10
camera_roi_x_max: 0.90
camera_roi_y_max: 0.90

# ---------------------------------------------------------------------------
# Nozzle detector sensitivity
# ---------------------------------------------------------------------------
detector_polarity: auto           # auto | dark | light
detector_gamma: 1.0
detector_sensitivity: 1.0         # 0.25 strict .. 4.0 permissive
detector_min_area_ratio: 0.0002   # Blob area / full native frame area
detector_max_area_ratio: 0.08
detector_min_circularity: 0.55
detector_min_convexity: 0.45
detector_min_inertia: 0.35
detector_min_confidence: 0.35
detector_adaptive_block_size: 35  # Odd number; even values are rounded up
detector_adaptive_c: 3.0
detector_blur_size: 5             # Odd number; even values are rounded up

# A position is accepted only after stable detections across multiple frames.
detection_stable_frames: 3
detection_stability_px: 2.0
detection_stability_ratio: 0.0    # Optional resolution-relative tolerance
detection_timeout: 12.0
detection_frame_interval_ms: 120

# ---------------------------------------------------------------------------
# Camera calibration and iterative centering
# ---------------------------------------------------------------------------
camera_model: affine              # affine recommended | quadratic
camera_calibration_radius: 0.6
camera_calibration_points: 10
camera_max_rms_error: 0.08
camera_center_tolerance: 0.01
camera_center_max_iterations: 12
camera_center_max_correction: 2.0
camera_center_max_step: 0.6
camera_center_damping: 0.8

# ---------------------------------------------------------------------------
# Motion - all values are mm/s except distances explicitly marked mm
# ---------------------------------------------------------------------------
xy_travel_speed: 100
z_travel_speed: 10
camera_move_speed: 20
camera_fine_speed: 5
camera_settle_ms: 350

# ---------------------------------------------------------------------------
# Physical Z switch (known values for this Voron; change on other machines)
# ---------------------------------------------------------------------------
pin: ^PF2
zswitch_x_pos: 68.0
zswitch_y_pos: -10.0
zswitch_z_pos: 7.0               # Configured switch/contact reference Z
zswitch_safe_z: 15.0             # Lift here before XY travel
zswitch_lift_z: 2.0              # Probe starts at zswitch_z_pos + this value
probe_speed_ratio: 0.5
probe_max_distance: 10.0
probe_samples: 10

# ---------------------------------------------------------------------------
# Safety and output
# ---------------------------------------------------------------------------
allow_during_print: false
# Measurement output only. Production config is never rewritten automatically.
result_file: ~/printer_data/config/tool_vision_results.json

# Optional workflow hooks. Context: tool_number, reference_tool, toolchanger,
# and tool_vision. Heating/cleaning belongs here because it is machine-specific.
start_gcode:
  M117 Tool Vision calibration
  {% for tool in tool_vision.tool_numbers %}
    M104 T{tool} S150
  {% endfor %}

# before_tool_gcode:
#   M118 Preparing T{tool_number}

# after_tool_gcode:
#   G4 P500

finish_gcode:
  {% for tool in tool_vision.tool_numbers %}
    M104 T{tool} S0
  {% endfor %}
  T0
  M117 Tool Vision complete

abort_gcode:
  {% for tool in tool_vision.tool_numbers %}
    M104 T{tool} S0
  {% endfor %}
  M117 Tool Vision aborted
