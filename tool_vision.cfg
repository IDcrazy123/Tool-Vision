# ToolVision 3 — minimal teach-once configuration
#
# Camera XY:
#   1. Home XYZ and mount T0.
#   2. Jog the nozzle near the center of the upward camera; focus it by eye.
#   3. Press/run TV_SETUP_CAMERA once.
#
# Switch Z:
#   1. Set only the real switch pin below.
#   2. Jog T0 above the switch, close enough to trigger within 10 mm.
#   3. Press/run TV_SETUP_SWITCH once.
#
# Positions, image thresholds, ROI, focus threshold, pixel scale, rotation,
# tool count and travel speeds are not normal cfg inputs. ToolVision learns or
# discovers them. Do not enable [axiscope] or [tools_calibrate] at the same time.

[tool_vision]
# Required only for Z measurement. Inversion/pull-up follow normal Klipper pin
# syntax. Verify the electrical state with QUERY_ENDSTOPS before first probing.
# pin: ^PF2

# Normally omit both camera fields. ToolVision discovers enabled webcams through
# Moonraker. If several cameras are enabled, name the nozzle camera:
# camera_name: nozzle

# Use an explicit source only when the camera is not registered in Moonraker.
# Accepted examples: snapshot/MJPEG/RTSP URL, /dev/video0, or OpenCV index 0.
# camera_source: http://127.0.0.1:8080/?action=snapshot

# Rare compatibility/path overrides; leave commented on normal installations.
# reference_tool: 0
# server_url: http://127.0.0.1:8085
# moonraker_url: http://127.0.0.1:7125
# tool_select_command: T{tool}
# state_file: ~/printer_data/config/tool_vision_state.json
# result_file: ~/printer_data/config/tool_vision_results.json

# Calibration automatically uses 150 C (the Axiscope/legacy reference), so the
# normal command stays simple: TV_CALIBRATE MODE=Z. ToolVision preheats every
# tool, waits for each active tool, then always turns all tool heaters off on
# success or failure. Advanced override only: TEMP=... (TEMP=0 means cold).

# Optional machine-specific hooks: start_gcode, before_tool_gcode,
# after_select_gcode, after_tool_gcode, finish_gcode, abort_gcode.
# after_select_gcode runs after pickup/temperature wait and before measurement,
# so it is the correct hook for your own CLEAN_NOZZLE/nozzle scrubber macro.
# ToolVision cannot infer safe scrubber coordinates for arbitrary hardware.
# after_select_gcode:
#   CLEAN_NOZZLE TEMP=150

# A machine with a tall fixture can teach explicit clearance without adding cfg:
#   TV_SETUP_CAMERA SAFE_Z=25
#   TV_SETUP_SWITCH SAFE_Z=25

# Simple Mainsail/Fluidd buttons: four normal actions plus report.
[gcode_macro TV_STATUS]
description: ToolVision - readiness and last error
gcode:
  TOOL_VISION_STATUS

[gcode_macro TV_SETUP_CAMERA]
description: ToolVision 1/3 - teach camera from current T0 position
gcode:
  TOOL_VISION_SETUP_CAMERA {rawparams}

[gcode_macro TV_SETUP_SWITCH]
description: ToolVision 2/3 - teach switch from current T0 position
gcode:
  TOOL_VISION_SETUP_SWITCH {rawparams}

[gcode_macro TV_CALIBRATE]
description: ToolVision 3/3 - auto-heat, measure, then cool all tools
gcode:
  TOOL_VISION_CALIBRATE {rawparams}

[gcode_macro TV_REPORT]
description: ToolVision - show latest relative offsets
gcode:
  TOOL_VISION_REPORT
